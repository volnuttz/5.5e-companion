name: Release to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_version:
        description: Cache version for this redeploy (for example v1.2.0-rebuild.1)
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run verify
      - name: Set service-worker cache version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.release_version }}
        run: sed -i "s/__RELEASE_VERSION__/${RELEASE_VERSION}/g" sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
